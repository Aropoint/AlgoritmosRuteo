# Tarea 2: todo se ejecuta con Docker Compose; Python solo corre dentro de los contenedores.
#   docker compose up --build            # BD + main.py (descarga, carga, pesos, rutas, diagrama) + sitio
#   docker compose run --rm pruebas      # pruebas unitarias
#   docker compose run --rm app python experimentos/run_flota.py --conjunto ajuste
#   docker compose exec db psql -U postgres -d ruteo_uav
#   docker compose down                  # detiene; los datos de la BD se conservan (volumen db_data)
name: ruteo-uav

x-app: &app
  build: ./05_T2
  image: ruteo-uav-app
  env_file:
    - path: .env
      required: false
  environment: &app-env
    PGHOST: db
    PGPORT: "5432"
    PGDATABASE: ${POSTGRES_DB:-ruteo_uav}
    PGUSER: ${POSTGRES_USER:-postgres}
    PGPASSWORD: ${POSTGRES_PASSWORD:-ruteo_uav_local}
  volumes:
    - ./05_T2:/app
  depends_on:
    db:
      condition: service_healthy

services:
  # La BD solo es accesible desde la red interna de Compose (no se publica en el equipo).
  db:
    image: pgrouting/pgrouting:17-3.5-3.8.0
    container_name: ruteo_uav_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ruteo_uav}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ruteo_uav_local}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  # main.py (raíz): pipeline completo y después el sitio web en este mismo contenedor.
  main:
    <<: *app
    container_name: ruteo_uav_main
    command: ["python", "/opt/main.py"]
    environment:
      <<: *app-env
      SIN_DESCARGA: ${SIN_DESCARGA:-0}
      SOLO_SITIO: ${SOLO_SITIO:-0}
      WEB_PORT: ${WEB_PORT:-8000}
    volumes:
      - ./05_T2:/app
      - ./main.py:/opt/main.py:ro
    ports:
      - "${WEB_PORT:-8000}:8000"

  # Pruebas unitarias: docker compose run --rm pruebas
  pruebas:
    <<: *app
    profiles: ["pruebas"]
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]

  # Comandos sueltos (experimentos, un script del ETL): docker compose run --rm app python ...
  app:
    <<: *app
    profiles: ["tareas"]

volumes:
  db_data:
